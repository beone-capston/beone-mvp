# 배포 워크플로(결정 40): develop push → 이미지 빌드·GHCR 푸시 → 스테이징 자동 배포,
# main push → 이미지 빌드·GHCR 푸시 → 운영 배포(Environment production 승인 1회 뒤).
#
# 꺼진 상태로 병합한다. 저장소 변수가 켜지기 전에는 gate job만 돌고 "비활성" 안내를 남긴 채 성공한다.
# 이때 GHCR 푸시·AWS 호출·서버 배포는 일어나지 않는다. 변수 설정은 승인 항목이다(docs/deployment/cd.md).
#   BEONE_CD_ENABLED                'true'일 때만 빌드·배포
#   AWS_REGION                      서버 인스턴스 리전(비밀 아님)
#   AWS_DEPLOY_ROLE_ARN_STAGING     스테이징 역할(develop ref만 신뢰, BeoneDeployStaging 문서만 실행)
#   AWS_DEPLOY_ROLE_ARN_PRODUCTION  운영 역할(environment:production만 신뢰, BeoneDeployProduction 문서만 실행)
#   BEONE_CD_PRODUCTION_ENABLED     'true'일 때만 운영 배포. Environment 보호 규칙을 먼저 설정한 뒤 켠다
# 역할·SSM 문서를 환경별로 나눠 develop 실행이 운영 문서를 부를 수 없게 한다(운영 승인 우회 차단).
# 비밀값은 GitHub에 두지 않는다. GHCR 로그인은 실행마다 자동 발급되는 GITHUB_TOKEN만 쓴다.
#
# 수동 실행(workflow_dispatch, 입력 없음): 첫 운영 배포용 이미지 발행 전용(docs/deployment/cd.md "첫 배포 이미지 발행").
# develop ref에서 실행했을 때만 이미지를 빌드·GHCR 푸시하고 내용 목록을 step summary에 남긴다. 위 변수와 무관하다.
# 배포하지 않는다. staging·production job은 push에서만 돌므로 AWS·OIDC·SSM 호출이 없다. 다른 ref는 안내만 남긴다.
name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

# 기본 권한은 읽기만. 쓰기 권한은 필요한 job에서만 준다.
permissions:
  contents: read

env:
  API_IMAGE: ghcr.io/beone-capston/beone-api
  WEB_IMAGE: ghcr.io/beone-capston/beone-web
  INSTANCE_ID: i-02c6e351ba6662e2e

jobs:
  gate:
    name: gate (저장소 변수 확인)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # push는 check, 수동 실행은 dispatch 단계 하나만 돈다. 실행되지 않은 단계의 출력은 빈 값이다.
    outputs:
      build: ${{ steps.check.outputs.build || steps.dispatch.outputs.build }}
      staging: ${{ steps.check.outputs.staging || steps.dispatch.outputs.staging }}
      production: ${{ steps.check.outputs.production || steps.dispatch.outputs.production }}
    steps:
      # 수동 발행 판정. develop ref만 빌드하고 배포는 언제나 하지 않는다. 저장소 변수를 읽지 않는다.
      - id: dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          build=false
          if [ "$GITHUB_REF" = 'refs/heads/develop' ]; then build=true; fi
          {
            echo "build=$build"
            echo "staging=false"
            echo "production=false"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## 수동 이미지 발행 게이트 ($GITHUB_REF)"
            if [ "$build" = true ]; then
              echo "- 활성: 이미지 빌드·GHCR 푸시만 합니다. 배포·AWS 호출은 하지 않습니다."
            else
              echo "- 비활성: 수동 발행은 develop ref에서만 합니다. 빌드·GHCR 푸시·AWS 호출·서버 배포를 하지 않았습니다."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "build=$build staging=false production=false"
      - id: check
        if: github.event_name == 'push'
        env:
          CD_ENABLED: ${{ vars.BEONE_CD_ENABLED }}
          REGION: ${{ vars.AWS_REGION }}
          ROLE_STAGING: ${{ vars.AWS_DEPLOY_ROLE_ARN_STAGING }}
          ROLE_PRODUCTION: ${{ vars.AWS_DEPLOY_ROLE_ARN_PRODUCTION }}
          PROD_ENABLED: ${{ vars.BEONE_CD_PRODUCTION_ENABLED }}
        run: |
          set -euo pipefail
          arn='^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$'
          common=''
          [ "${CD_ENABLED:-}" = 'true' ] || common="$common BEONE_CD_ENABLED"
          [[ "${REGION:-}" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]$ ]] || common="$common AWS_REGION"
          staging=false
          production=false
          s_reason="$common"
          p_reason="$common"
          [[ "${ROLE_STAGING:-}" =~ $arn ]] || s_reason="$s_reason AWS_DEPLOY_ROLE_ARN_STAGING"
          [[ "${ROLE_PRODUCTION:-}" =~ $arn ]] || p_reason="$p_reason AWS_DEPLOY_ROLE_ARN_PRODUCTION"
          [ "${PROD_ENABLED:-}" = 'true' ] || p_reason="$p_reason BEONE_CD_PRODUCTION_ENABLED"
          if [ "$GITHUB_REF" = 'refs/heads/develop' ] && [ -z "$s_reason" ]; then staging=true; fi
          if [ "$GITHUB_REF" = 'refs/heads/main' ] && [ -z "$p_reason" ]; then production=true; fi
          build=false
          if [ "$staging" = true ] || [ "$production" = true ]; then build=true; fi
          {
            echo "build=$build"
            echo "staging=$staging"
            echo "production=$production"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## 배포 게이트 ($GITHUB_REF)"
            if [ "$build" = true ]; then
              echo "- 활성: 빌드·$([ "$staging" = true ] && echo 스테이징 || echo 운영) 배포를 진행합니다."
            else
              case "$GITHUB_REF" in
                refs/heads/develop) echo "- 비활성: 설정되지 않았거나 형식이 틀린 변수:${s_reason}" ;;
                refs/heads/main) echo "- 비활성: 설정되지 않았거나 형식이 틀린 변수:${p_reason}" ;;
                *) echo "- 비활성: develop·main이 아닌 ref" ;;
              esac
              echo "- GHCR 푸시·AWS 호출·서버 배포를 하지 않았습니다."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "build=$build staging=$staging production=$production"

  build:
    name: build (이미지 빌드·GHCR 푸시)
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 수동 발행은 ref별로 하나씩만(취소하지 않음). push 실행은 실행마다 다른 그룹이라 기존과 같이 묶이지 않는다.
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && format('deploy-publish-{0}', github.ref) || format('deploy-build-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 테스트는 PR CI(ci.yml)에서 끝났다. 여기서는 배포할 dist만 만든다.
      - name: frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: GHCR 로그인
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      # deploy/scripts/build-image.sh와 같은 방식: linux/amd64 단일 플랫폼, 증명 메타데이터 없음, 리비전 라벨.
      - name: api 이미지
        id: api
        run: |
          set -euo pipefail
          docker buildx create --use --name beone-builder >/dev/null
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" --label "beone.source.state=clean" \
            --tag "${API_IMAGE}:${GITHUB_SHA}" --metadata-file "$RUNNER_TEMP/api.json" --push backend
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/api.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "api digest를 얻지 못했습니다" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: web 이미지(dist만)
        id: web
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --file deploy/web/Dockerfile \
            --tag "${WEB_IMAGE}:${GITHUB_SHA}" --metadata-file "$RUNNER_TEMP/web.json" --push frontend/dist
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/web.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "web digest를 얻지 못했습니다" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: digest 기록
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          {
            echo "## 이미지"
            echo "| 이미지 | 태그 | digest |"
            echo "|---|---|---|"
            echo "| ${API_IMAGE} | ${GITHUB_SHA} | \`${API_DIGEST}\` |"
            echo "| ${WEB_IMAGE} | ${GITHUB_SHA} | \`${WEB_DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      # 수동 발행만: 푸시한 digest를 받아 내용 목록을 남긴다. 파일 내용과 Env 값은 출력하지 않는다(경로·크기·이름만).
      - name: 이미지 내용 목록(수동 발행)
        if: github.event_name == 'workflow_dispatch'
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: .github/scripts/image-inventory.sh "${API_IMAGE}@${API_DIGEST}" "${WEB_IMAGE}@${WEB_DIGEST}" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: GHCR 로그아웃
        if: always()
        run: docker logout ghcr.io

  staging:
    name: staging (develop → 스테이징 배포)
    needs: [gate, build]
    # 수동 실행에서는 절대 돌지 않는다(push 조건). 수동 경로에는 id-token 권한이 가지 않는다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.gate.outputs.staging == 'true'
    # environment를 두지 않는다. 두면 OIDC sub가 environment:staging으로 바뀌어 신뢰 정책(ref:refs/heads/develop)과 맞지 않는다.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_STAGING }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: beone-deploy-staging
          mask-aws-account-id: true
      # 값은 env로 넘긴다(run 안에 식을 직접 넣지 않는다). 형식은 스크립트가 다시 검사한다.
      - name: SSM BeoneDeployStaging
        env:
          API_DIGEST: ${{ needs.build.outputs.api_digest }}
          WEB_DIGEST: ${{ needs.build.outputs.web_digest }}
        run: .github/scripts/ssm-deploy.sh staging "$API_DIGEST" "$WEB_DIGEST" "$GITHUB_SHA"

  production:
    name: production (main → 운영 배포, 승인 필요)
    needs: [gate, build]
    # 수동 실행에서는 절대 돌지 않는다(push 조건).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.gate.outputs.production == 'true'
    # Environment production의 필수 승인자(사용자)가 승인해야 시작한다. OIDC sub는 environment:production이다.
    # 운영 역할은 이 sub에서만 맡을 수 있으므로 Environment 보호 규칙이 운영 배포의 승인 지점이다.
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PRODUCTION }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: beone-deploy-production
          mask-aws-account-id: true
      # 값은 env로 넘긴다(run 안에 식을 직접 넣지 않는다). 형식은 스크립트가 다시 검사한다.
      - name: SSM BeoneDeployProduction
        env:
          API_DIGEST: ${{ needs.build.outputs.api_digest }}
          WEB_DIGEST: ${{ needs.build.outputs.web_digest }}
        run: .github/scripts/ssm-deploy.sh production "$API_DIGEST" "$WEB_DIGEST" "$GITHUB_SHA"
