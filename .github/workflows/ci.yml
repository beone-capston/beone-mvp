# PR CI: develop·main 대상 PR에서 backend 단위·웹 슬라이스 테스트와 frontend lint·test·build를 돌린다.
# 비밀값을 쓰지 않고 저장소 읽기 권한만 쓴다. 외부(GHCR·AWS·서버)에는 아무 작업도 하지 않는다(결정 40).
# integrationTest(Testcontainers MySQL)는 넣지 않는다. Docker 이미지 다운로드와 컨테이너 기동으로 실행 시간이
# 길고 러너 메모리 변동에 따라 불안정할 수 있어서다. 통합 테스트는 지금처럼 작성자가 로컬에서 실행해 PR에 적는다.
name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

# 같은 PR에 새 커밋이 오면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (test, webTest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties
      # 단위 테스트와 웹 슬라이스 테스트만 실행한다. 둘 다 Docker·DB가 필요 없다.
      - run: ./gradlew --no-daemon test webTest

  frontend:
    name: frontend (lint, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 버전은 frontend/.nvmrc(24)를 따른다. package.json engines도 ">=24"다.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
