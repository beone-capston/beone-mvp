<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 외부 요청 차단: 이 페이지를 서빙한 origin의 파일만 읽는다. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>브리지 시험 iframe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-role="frame" class="frame">
  <p class="warn">시험 전용 iframe (BR19·BR20)</p>
  <dl>
    <dt>origin</dt><dd id="origin"></dd>
    <dt><code>typeof window.BeoneBridge</code></dt><dd><strong id="bridge-type"></strong> <button type="button" id="refresh-type">다시 확인하고 기록</button></dd>
  </dl>

  <label for="message">보낼 문자열</label>
  <textarea id="message" rows="2" spellcheck="false" autocomplete="off"></textarea>
  <p>length: <strong id="message-length">0</strong> <button type="button" id="send" class="primary">보내기</button></p>
  <div class="buttons">
    <button type="button" data-preset='{"v":1,"type":"state.get"}'>state.get</button>
    <button type="button" data-preset='{"v":1,"type":"auth.request"}'>auth.request</button>
    <button type="button" data-preset="not json">not json</button>
  </div>
  <p><button type="button" id="send-buffer">ArrayBuffer 보내기</button></p>

  <p>기록(이 iframe의 origin 웹 저장소) <span id="log-count"></span> <button type="button" id="clear-log">지우기</button></p>
  <ol id="log" class="log"></ol>

  <script src="test.js" defer></script>
</body>
</html>
