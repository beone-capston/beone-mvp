# 스테이징 nginx(beone-staging). conf.d로 http 블록 안에 포함된다. 절차: docs/deployment/staging.md
# 8080: 기본 인증. /는 웹 릴리스 링크(current), /api/는 backend. 8081: deploy.sh 공개 스모크 전용(인증 없음, 점검 경로만).
# 두 리스너 모두 호스트에서는 127.0.0.1에만 열린다(compose.yaml).
# 인증 링크 경로는 query(token)를 접근 로그에 남기지 않는다(N2 관리 판단: query 방식 유지, $request 대신 $uri)
log_format beone_staging_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    root /srv/web/current;

    # 접근 제한(결정 40-4). 파일에는 사용자·해시만 있고 값은 저장소에 두지 않는다
    auth_basic "BeONE staging";
    auth_basic_user_file /etc/nginx/htpasswd;

    location / {
        try_files $uri $uri/ /index.html;
    }
    # 이메일 인증·비밀번호 재설정 링크(?token=). 토큰이 Referer와 접근 로그로 새지 않게 한다(N2)
    location = /email-verification {
        add_header Referrer-Policy "no-referrer" always;
        access_log /var/log/nginx/access.log beone_staging_noquery;
        try_files /index.html =404;
    }
    location = /password-reset {
        add_header Referrer-Policy "no-referrer" always;
        access_log /var/log/nginx/access.log beone_staging_noquery;
        try_files /index.html =404;
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # 클라이언트 값을 그대로 넘기지 않고 덮어쓴다(앱은 X-Forwarded-*를 해석하지 않음, 결정 38-7)
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded         "";
        # 기본 인증 헤더를 backend로 넘기지 않는다
        proxy_set_header Authorization     "";
        client_max_body_size 64k;          # N4 결정 전 검증 환경과 같은 값
        proxy_read_timeout 30s;
    }
    location /actuator/ { return 404; }
    location = /api     { return 404; }
}

# 배포 스모크 전용(smoke-public.sh). 아래 네 경로 밖은 모두 404
server {
    listen 8081;
    server_name _;
    root /srv/web/current;

    location = / {
        try_files /index.html =404;
    }
    location = /api/v1/me {
        proxy_pass http://backend:8080;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded       "";
    }
    location = /api/v1/auth/csrf {
        proxy_pass http://backend:8080;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded       "";
    }
    location / { return 404; }
}
