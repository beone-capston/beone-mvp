# beone-staging: develop 병합 뒤 자동 배포되는 스테이징(결정 40-4). 절차: docs/deployment/staging.md
# 기존 beone(공개 nginx)·beone-app(운영)·beone-verify(검증)와 이름·네트워크·볼륨을 공유하지 않는다.
# 실행: docker compose -f /opt/beone/staging/compose.yaml -p beone-staging --env-file /opt/beone/staging/.env ...
#   배포는 deploy.sh staging <ApiDigest> <WebDigest> <GitSha>가 BEONE_API_IMAGE를 digest 참조로 덮어써서 한다.
# 메모리 상한 합계 1344MiB(mysql 512 + backend 768 + web 64). beone-verify와 동시에 띄우지 않는다.
# oom_score_adj를 운영(기본 0)보다 크게 두어 메모리가 모자라면 스테이징이 먼저 종료된다.
# 호스트 포트는 127.0.0.1에만 연다: 18082(기본 인증), 18081(배포 스모크 전용, 인증 없음·점검 경로만).
name: beone-staging

x-logging: &staging-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  mysql:
    image: mysql:8.4.11            # 운영·로컬과 같은 태그. 서버에 있는 이미지를 쓴다
    pull_policy: never
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --disable-log-bin            # 스테이징은 덤프·시점 복구 대상이 아니다
      - --max-connections=40
    volumes:
      - staging-mysql-data:/var/lib/mysql   # 이 프로젝트 전용 볼륨(beone-staging_staging-mysql-data)
    networks: [staging]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    memswap_limit: 512m
    oom_score_adj: 800
    # 메모리 부족으로 종료되면 몇 번만 다시 띄우고 멈춘다(운영 메모리를 계속 빼앗지 않게). 서버 재부팅 뒤에는 다음 배포가 다시 띄운다
    restart: on-failure:3
    logging: *staging-logging

  backend:
    # deploy.sh가 ghcr.io/beone-capston/beone-api@<digest>로 덮어쓴다. 이미지는 deploy.sh가 digest로 미리 pull한다
    image: ${BEONE_API_IMAGE:?set BEONE_API_IMAGE (ghcr.io/beone-capston/beone-api@sha256:...)}
    pull_policy: never
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 운영과 같은 공개 프로필(prod → member 그룹). 실메일 키가 하나라도 없으면 기동하지 않는다(결정 39-6)
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?set MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER:?set MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:?set SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:?set SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:?set SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:?set SPRING_MAIL_PASSWORD}
      BEONE_MAIL_FROM: ${BEONE_MAIL_FROM:?set BEONE_MAIL_FROM}
      BEONE_MAIL_LINK_BASE_URL: ${BEONE_MAIL_LINK_BASE_URL:?set BEONE_MAIL_LINK_BASE_URL (https 스테이징 주소)}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -XX:MaxMetaspaceSize=160m -Xss512k -XX:+ExitOnOutOfMemoryError
      # CODEF 키는 넣지 않는다(결정 40-7). deploy.sh는 env에 CODEF 키 이름이 있으면 배포를 거부한다
    networks: [staging]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 240s
    mem_limit: 768m
    memswap_limit: 768m
    oom_score_adj: 900
    restart: on-failure:3
    logging: *staging-logging

  web:
    image: ${BEONE_STAGING_NGINX_IMAGE:?set to the nginx image already on the server}
    pull_policy: never
    depends_on:
      # backend health는 deploy.sh가 따로 기다린다. web은 backend가 내려가도 떠 있게 시작 순서만 맞춘다
      backend:
        condition: service_started
    volumes:
      # releases/<릴리스>와 상대 경로 링크 current. deploy.sh가 링크를 원자 전환한다
      - ./web:/srv/web:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 기본 인증 파일(사용자·해시). 값은 저장소에 두지 않고 서버에서 만든다
      - ./htpasswd:/etc/nginx/htpasswd:ro
    ports:
      - "127.0.0.1:18082:8080"     # 기본 인증 리스너
      - "127.0.0.1:18081:8081"     # 배포 스모크 전용 리스너(점검 경로만)
    networks: [staging]
    mem_limit: 64m
    memswap_limit: 64m
    oom_score_adj: 900
    restart: on-failure:3
    logging: *staging-logging

networks:
  staging: {}

volumes:
  staging-mysql-data: {}
