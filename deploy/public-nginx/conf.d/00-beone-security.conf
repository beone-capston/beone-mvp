# 공개 nginx 보안 헤더·요청 제한(N4 표준안, T6). http 문맥 파일이다. 서버의 /opt/beone/nginx/conf.d/에 두면 conf.d/*.conf로 읽힌다.
# 이름이 00-으로 시작해 default.conf·staging.conf보다 먼저 읽힌다(아래 영역·변수를 그 파일들이 쓴다).
# 절차: docs/deployment/public-nginx-security.md

# 요청 제한 영역. 키는 공개 nginx가 직접 받은 접속 주소($binary_remote_addr)다. 앞단 프록시가 없으므로 X-Forwarded-For는 믿지 않는다.
# 인증·가입·메일 요청: IP당 분당 10회. 일반 /api: IP당 초당 10회. 10m 영역은 주소 약 16만 개를 담는다
limit_req_zone $binary_remote_addr zone=beone_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=beone_api:10m rate=10r/s;

# Referrer-Policy 기본값. 업스트림이 이미 정했으면(스테이징 web의 인증 링크 경로 no-referrer, N2) 덧붙이지 않는다.
# add_header는 값이 빈 문자열이면 헤더를 보내지 않는다
map $upstream_http_referrer_policy $beone_referrer_policy {
    ""      "strict-origin-when-cross-origin";
    default "";
}
