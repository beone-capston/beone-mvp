# 요청 제한 초과 응답(429). server 문맥에 한 번 include한다. 형식은 공통 API 오류 형식과 같다(docs/api.md, docs/api/auth.md RATE_LIMITED).
# error_page는 nginx가 만든 429에만 걸린다(proxy_intercept_errors 기본 off). 백엔드가 직접 보낸 429·Retry-After는 그대로 지나간다.
location @beone_auth_limited {
    default_type "application/json; charset=utf-8";
    include /etc/nginx/conf.d/beone/security-headers.conf;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;
    # 분당 10회 영역은 6초마다 1회가 다시 찬다
    add_header Retry-After "6" always;
    return 429 '{"code":"RATE_LIMITED","message":"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.","errors":[]}';
}
location @beone_api_limited {
    default_type "application/json; charset=utf-8";
    include /etc/nginx/conf.d/beone/security-headers.conf;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "1" always;
    return 429 '{"code":"RATE_LIMITED","message":"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.","errors":[]}';
}
