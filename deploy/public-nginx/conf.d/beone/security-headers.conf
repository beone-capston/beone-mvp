# 보안 헤더(N4 표준안). server 문맥에 include한다. add_header는 하위 location이 자기 add_header를 하나라도 두면 상위 것이
# 모두 사라지므로, add_header를 가진 location(인증 링크 경로, 429 응답 등)에서도 이 파일을 다시 include한다.
# Referrer-Policy는 referrer-policy.conf에 따로 둔다(인증 링크 경로는 no-referrer를 직접 붙이므로).

# HSTS 1년. includeSubDomains는 결정 필요(하위 도메인 전체가 HTTPS인지 확인 전이라 넣지 않음)
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
# 다른 사이트의 iframe 삽입 차단. CSP는 frame-ancestors만 보내고 본체(script-src 등)는 넣지 않는다
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
