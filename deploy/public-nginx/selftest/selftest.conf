# public-nginx-selftest.sh 전용 설정. 운영·스테이징 server 블록의 모양을 흉내 내고 업스트림은 같은 컨테이너 안 스텁(9000)이다.
# 서버에 두지 않는다. 인증서·도메인 없이 평문 리스너로 헤더·요청 제한만 본다.

# 운영 모양: 정적 파일은 nginx가 직접, /api/만 업스트림(docs/deployment/public-proxy.md 2절)
server {
    listen 8080;
    root /srv/web;
    include /etc/nginx/conf.d/beone/security-headers.conf;
    include /etc/nginx/conf.d/beone/referrer-policy.conf;
    include /etc/nginx/conf.d/beone/rate-limited.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /email-verification {
        include /etc/nginx/conf.d/beone/security-headers.conf;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }
    location = /password-reset {
        include /etc/nginx/conf.d/beone/security-headers.conf;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }
    location ~ ^/api/v1/auth/(sign-up|email-verification-requests|email-verifications|login|password-reset-requests|password-resets)$ {
        include /etc/nginx/conf.d/beone/limit-auth.conf;
        proxy_pass http://127.0.0.1:9000;
    }
    location /api/ {
        include /etc/nginx/conf.d/beone/limit-api.conf;
        proxy_pass http://127.0.0.1:9000;
    }
    location /actuator/ { return 404; }
}

# 스테이징 모양: 요청 전체를 스테이징 web으로 넘긴다(public-proxy.md 2-1절). 스텁이 인증 링크 경로에 no-referrer를 붙인다
server {
    listen 8082;
    include /etc/nginx/conf.d/beone/security-headers.conf;
    include /etc/nginx/conf.d/beone/referrer-policy.conf;
    include /etc/nginx/conf.d/beone/rate-limited.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~ ^/api/v1/auth/(sign-up|email-verification-requests|email-verifications|login|password-reset-requests|password-resets)$ {
        include /etc/nginx/conf.d/beone/limit-auth.conf;
        proxy_pass http://127.0.0.1:9000;
    }
    location /api/ {
        include /etc/nginx/conf.d/beone/limit-api.conf;
        proxy_pass http://127.0.0.1:9000;
    }
    location / {
        proxy_pass http://127.0.0.1:9000;
    }
}

# 업스트림 스텁(백엔드·스테이징 web 대역)
server {
    listen 127.0.0.1:9000;
    default_type application/json;
    location = /email-verification {
        add_header Referrer-Policy "no-referrer";
        return 200 "<!doctype html>\n";
    }
    location = /api/v1/backend-429 {
        add_header Retry-After "30" always;   # 4xx 응답에는 always가 있어야 붙는다
        return 429 '{"code":"RATE_LIMITED","from":"backend"}';
    }
    location / {
        return 200 '{"ok":true}';
    }
}
