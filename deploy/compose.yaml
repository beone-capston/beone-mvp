# 배포용 백엔드와 MySQL.
# 서버의 기존 nginx Compose(/opt/beone/compose.yaml, 프로젝트 beone)와 분리된 프로젝트로 띄운다.
# 항상 파일(-f)·프로젝트(-p)·환경 파일(--env-file)을 명시해 실행한다. 절차는 docs/deployment/backend-compose.md.
# 두 서비스 모두 호스트 포트를 공개하지 않는다. 외부 80·443은 기존 nginx만 담당하며, 이 단계에서는 /api·/actuator를 프록시하지 않는다.
# MySQL 이미지 태그는 루트 docker-compose.yml(로컬 개발)과 같게 유지한다.
name: beone-app

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in the env file}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in the env file}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in the env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in the env file}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # binlog는 켠 채 3일만 보관한다(2026-11-15 사용자 결정). 시점 복구 절차는 아직 없고 백업은 덤프로 한다.
      - --binlog-expire-logs-seconds=259200
      - --innodb-buffer-pool-size=256M
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    restart: unless-stopped
    logging: *default-logging

  backend:
    image: ${BEONE_API_IMAGE:?set BEONE_API_IMAGE to the image reference}
    # compose가 pull하지 않는다. deploy.sh가 digest로 먼저 pull하고(ghcr.io/beone-capston/beone-api@sha256:…) 이 변수를 덮어쓴다.
    # 수동 절차는 docker load로 들여온 태그를 쓴다
    pull_policy: never
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 공개 프로필(prod → member 그룹, 결정 38-6). 운영 환경 파일에 SPRING_PROFILES_ACTIVE=prod를 둔다.
      # 기본값을 두지 않는다. 비면 compose가 바로 실패한다. 검증(verify-local.sh)은 자기 값으로 prod를 명시한다
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?set SPRING_PROFILES_ACTIVE (prod) in the env file}
      # Docker 내부 이름으로 접속한다. application.yml의 localhost 기본값으로 떨어지지 않게 항상 넣는다.
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?set MYSQL_DATABASE in the env file}
      DB_USERNAME: ${MYSQL_USER:?set MYSQL_USER in the env file}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in the env file}
      # 실메일(N1, 결정 39-6). prod는 하나라도 없으면 기동하지 않는다. 앱 비밀번호는 서버 환경 파일에만 둔다
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:?set SPRING_MAIL_HOST in the env file}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:?set SPRING_MAIL_PORT in the env file}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:?set SPRING_MAIL_USERNAME in the env file}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:?set SPRING_MAIL_PASSWORD in the env file}
      BEONE_MAIL_FROM: ${BEONE_MAIL_FROM:?set BEONE_MAIL_FROM in the env file}
      BEONE_MAIL_LINK_BASE_URL: ${BEONE_MAIL_LINK_BASE_URL:?set BEONE_MAIL_LINK_BASE_URL (https) in the env file}
      # CODEF 키는 넣지 않는다(prod 미등록, 결정 38-8·40-7). deploy.sh는 env에 CODEF 키 이름이 있으면 배포를 거부한다
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
    healthcheck:
      # 추가 도구 없이 bash의 /dev/tcp로 내부 health를 조회한다.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s
    mem_limit: 1g
    restart: unless-stopped
    logging: *default-logging

volumes:
  mysql-data:
