# beone-verify: 서버 루프백 전용 검증 환경(결정 39-1, N17 member 프로필 허용).
# 기존 beone(공개 nginx)·beone-app(운영 backend·DB)·beone-app-restore-*와 이름·네트워크·볼륨을 공유하지 않는다.
# 실행: sudo docker compose -f /opt/beone/verify/compose.yaml -p beone-verify --env-file /opt/beone/verify/.env up -d
# 메모리 상한 합계 1344MiB(mysql 512 + backend 768 + web 64). 로컬 스모크에서 backend 640m은 97%까지 차서 768m으로 올렸다.
# 운영 절차: deploy/verify/RUNBOOK.md
name: beone-verify

x-logging: &verify-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  verify-mysql:
    image: mysql:8.4.11            # 서버에 이미 있는 이미지 재사용(추가 다운로드 없음)
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --disable-log-bin
      - --max-connections=40
    volumes:
      - verify-mysql-data:/var/lib/mysql
    networks: [verify]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    memswap_limit: 512m
    oom_score_adj: 800             # 메모리 부족 시 운영보다 먼저 종료되게
    restart: "no"
    logging: *verify-logging

  verify-backend:
    image: ${BEONE_VERIFY_API_IMAGE:?set BEONE_VERIFY_API_IMAGE (beone-api:<sha12>)}
    pull_policy: never
    depends_on:
      verify-mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: member          # 결정 39-1 N17. prod·local·demo 아님. CODEF 미등록
      DB_URL: jdbc:mysql://verify-mysql:3306/${MYSQL_DATABASE:?set MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER:?set MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -XX:MaxMetaspaceSize=160m -Xss512k -XX:+ExitOnOutOfMemoryError
      # CODEF_*·BEONE_CODEF_*·메일 설정은 넣지 않는다
    networks: [verify]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 240s
    mem_limit: 768m
    memswap_limit: 768m
    oom_score_adj: 900
    restart: "no"
    logging: *verify-logging

  verify-web:
    image: ${BEONE_VERIFY_NGINX_IMAGE:?set to the nginx image already on the server}
    depends_on:
      verify-backend:
        condition: service_healthy
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:18080:80"       # 루프백 전용
    networks: [verify]
    mem_limit: 64m
    memswap_limit: 64m
    oom_score_adj: 900
    restart: "no"
    logging: *verify-logging

networks:
  verify: {}

volumes:
  verify-mysql-data: {}
