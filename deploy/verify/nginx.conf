# 검증 nginx(beone-verify). /는 SPA, /api/는 검증 backend로 넘기고 전달 헤더를 덮어쓴다. 실행 절차: deploy/verify/RUNBOOK.md
# 이 파일은 conf.d로 http 블록 안에 포함된다. 인증 링크 경로는 query(token)를 접근 로그에 남기지 않는 형식을 쓴다(N2 관리 판단)
log_format beone_verify_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    # 이메일 인증·비밀번호 재설정 링크(?token=). 토큰이 Referer와 접근 로그로 새지 않게 한다(N2 관리 판단: query 방식 유지)
    location = /email-verification {
        add_header Referrer-Policy "no-referrer" always;
        access_log /var/log/nginx/access.log beone_verify_noquery;
        try_files /index.html =404;
    }
    location = /password-reset {
        add_header Referrer-Policy "no-referrer" always;
        access_log /var/log/nginx/access.log beone_verify_noquery;
        try_files /index.html =404;
    }
    location /api/ {
        proxy_pass http://verify-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded         "";
        client_max_body_size 64k;
        proxy_read_timeout 30s;
    }
    location /actuator/ { return 404; }
    location = /api     { return 404; }
}
