# beone-demo: 시연 영상 촬영용 시연 모드 서버(2026-11-27 사용자 결정, 런북 docs/deployment/demo-mode.md).
# 백엔드는 demo 프로필 단독이다. member·prod와 함께 켜면 CurrentUserModeGuard·PublicProfileGuard가 기동을 멈춘다.
# 기존 beone(공개 nginx)·beone-app(운영)·beone-staging·beone-verify와 이름·네트워크·볼륨을 공유하지 않는다.
# 실행: docker compose -f /opt/beone/demo/compose.yaml -p beone-demo --env-file /opt/beone/demo/.env up -d
# 메모리 상한 합계 1344MiB(mysql 512 + backend 768 + web 64, 스테이징과 같은 값). 스테이징을 stop(볼륨 보존)한 자리에 띄운다.
# beone-verify와 동시에 띄우지 않는다. oom_score_adj로 메모리가 모자라면 운영보다 먼저 종료된다.
# 호스트 포트는 127.0.0.1에만 연다: 18083(기본 인증), 18084(준비 스크립트 전용, 인증 없음, /api/만). 공개 도메인 연결은
# compose.staging-domain.yaml 오버레이(공개 nginx가 닿는 스테이징 네트워크에 web을 붙임)와 런북 3절.
name: beone-demo

x-logging: &demo-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  mysql:
    image: mysql:8.4.11            # 운영·로컬과 같은 태그. 서버에 있는 이미지를 쓴다
    pull_policy: never
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --disable-log-bin            # 시연 DB는 덤프·시점 복구 대상이 아니다
      - --max-connections=40
    volumes:
      - demo-mysql-data:/var/lib/mysql   # 이 프로젝트 전용 볼륨(beone-demo_demo-mysql-data)
    networks: [demo]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    memswap_limit: 512m
    oom_score_adj: 800
    restart: on-failure:3
    logging: *demo-logging

  backend:
    # 운영과 같은 백엔드 이미지 ghcr.io/beone-capston/beone-api@sha256:<digest>. 런북 2절처럼 digest로 먼저 pull한다
    image: ${BEONE_API_IMAGE:?set BEONE_API_IMAGE (ghcr.io/beone-capston/beone-api@sha256:...)}
    pull_policy: never
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 기본값 demo. 다른 값은 런북 부록의 대안(local)만 쓴다. prod·member·staging은 넣지 않는다
      SPRING_PROFILES_ACTIVE: ${BEONE_DEMO_PROFILES:-demo}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?set MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER:?set MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -XX:MaxMetaspaceSize=160m -Xss512k -XX:+ExitOnOutOfMemoryError
      # demo는 가짜 메일(메모리 보관, 로그 없음)·가짜 CODEF를 쓴다. SMTP·CODEF 키는 넣지 않는다
    networks: [demo]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 240s
    mem_limit: 768m
    memswap_limit: 768m
    oom_score_adj: 900
    restart: on-failure:3
    logging: *demo-logging

  web:
    image: ${BEONE_DEMO_NGINX_IMAGE:?set to the nginx image already on the server}
    pull_policy: never
    depends_on:
      backend:
        condition: service_started
    volumes:
      # 운영 web 이미지(beone-web@sha256:<digest>)에서 꺼낸 dist. web/current에 둔다(런북 2절, 부록 B의 별도 빌드도 같은 자리)
      - ./web:/srv/web:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 기본 인증 파일(사용자·해시). 스테이징 파일을 그대로 쓴다(기본값). 새 파일을 쓰려면 BEONE_DEMO_HTPASSWD에 경로를 준다
      - ${BEONE_DEMO_HTPASSWD:-../staging/htpasswd}:/etc/nginx/htpasswd:ro
    ports:
      - "127.0.0.1:18083:8080"     # 기본 인증 리스너(공개 nginx가 넘김)
      - "127.0.0.1:18084:8081"     # 준비 스크립트 전용(인증 없음, /api/만). 공개 nginx가 넘기지 않는다
    networks: [demo]
    mem_limit: 64m
    memswap_limit: 64m
    oom_score_adj: 900
    restart: on-failure:3
    logging: *demo-logging

networks:
  demo: {}

volumes:
  demo-mysql-data: {}
