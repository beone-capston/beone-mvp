# 시연 모드 nginx(beone-demo). conf.d로 http 블록 안에 포함된다. 절차: docs/deployment/demo-mode.md
# 8080: 기본 인증. /는 시연용 프론트 빌드(/srv/web/current), /api/는 backend(demo 프로필). 공개 nginx가 이 리스너로 넘긴다.
# 8081: 준비 스크립트(seed-demo.sh) 전용. 인증 없음, /api/만 넘긴다. 공개 nginx가 넘기지 않는다.
# 두 리스너 모두 호스트에서는 127.0.0.1에만 열린다(compose.yaml).
# 인증 링크 경로는 query(token)를 접근 로그에 남기지 않는다(스테이징과 같은 N2 조건)
log_format beone_demo_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    root /srv/web/current;

    auth_basic "BeONE demo";
    auth_basic_user_file /etc/nginx/htpasswd;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /email-verification {
        add_header Referrer-Policy "no-referrer" always;
        access_log /var/log/nginx/access.log beone_demo_noquery;
        try_files /index.html =404;
    }
    location = /password-reset {
        add_header Referrer-Policy "no-referrer" always;
        access_log /var/log/nginx/access.log beone_demo_noquery;
        try_files /index.html =404;
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # 클라이언트 값을 그대로 넘기지 않고 덮어쓴다(결정 38-7)
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded         "";
        # 기본 인증 헤더를 backend로 넘기지 않는다
        proxy_set_header Authorization     "";
        client_max_body_size 64k;
        proxy_read_timeout 30s;
    }
    location /actuator/ { return 404; }
    location = /api     { return 404; }
}

# 준비 스크립트(seed-demo.sh) 전용. 가입·로그인·카드·월간 상태·주문·추천·모의 승인을 그대로 부르므로 /api/를 넘긴다.
# 인증이 없으므로 호스트 127.0.0.1에만 열고 공개 nginx는 넘기지 않는다. /actuator/health는 기동 확인용이다
server {
    listen 8081;
    server_name _;

    location = /actuator/health {
        proxy_pass http://backend:8080;
        proxy_set_header Host            $host;
        proxy_set_header Forwarded       "";
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded       "";
        client_max_body_size 64k;
        proxy_read_timeout 30s;
    }
    location / { return 404; }
}
