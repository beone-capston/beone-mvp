plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.beone'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

// Unit tests: no Spring context, no Docker.
tasks.named('test', Test) {
	useJUnitPlatform {
		// codef-sandbox는 외부를 호출하므로 반드시 뺀다.
		excludeTags 'integration', 'web', 'codef-sandbox'
	}
	// Read by MySqlVersionAlignmentTest; declared so edits re-run the test.
	inputs.file(layout.projectDirectory.file('../docker-compose.yml'))
		.withPathSensitivity(PathSensitivity.NONE)
	// EvaluationFixtureMappingTest가 읽는 파일. fixture가 바뀌면 테스트를 다시 실행하도록 입력으로 선언한다.
	inputs.file(layout.projectDirectory.file('../fixtures/evaluation-cases.json'))
		.withPathSensitivity(PathSensitivity.NONE)
	// RuleDataConsistencyTest가 읽는 근거 표. 표가 바뀌면 테스트를 다시 실행하도록 입력으로 선언한다.
	inputs.dir(layout.projectDirectory.dir('../docs/rules'))
		.withPathSensitivity(PathSensitivity.RELATIVE)
}

// Integration tests: @IntegrationTest (Testcontainers MySQL). Requires Docker.
def integrationTest = tasks.register('integrationTest', Test) {
	description = 'Runs @IntegrationTest tests against a Testcontainers MySQL.'
	group = LifecycleBasePlugin.VERIFICATION_GROUP
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'integration'
	}
	shouldRunAfter tasks.named('test')
}

// 웹 슬라이스 테스트: @WebSliceTest(@WebMvcTest + MockMvc). DB·Docker 없이 실행한다.
def webTest = tasks.register('webTest', Test) {
	description = 'Runs @WebSliceTest tests against a Spring MVC slice without a database.'
	group = LifecycleBasePlugin.VERIFICATION_GROUP
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'web'
	}
	shouldRunAfter tasks.named('test')
}

// CODEF 샌드박스 형식 확인: 외부를 호출한다. check·build에 넣지 않고 사용자가 직접 실행한다(docs/development/codef-sandbox-check.md).
tasks.register('codefSandboxCheck', Test) {
	description = 'Calls the CODEF sandbox once per API and prints only allowed fields.'
	group = LifecycleBasePlugin.VERIFICATION_GROUP
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'codef-sandbox'
	}
	systemProperty 'beone.codef.sandbox.confirmed', 'true'
	outputs.upToDateWhen { false }
	testLogging {
		showStandardStreams = true
		showExceptions = false
		showCauses = false
		showStackTraces = false
	}
}

// 일반 테스트에는 실제 키를 넘기지 않는다. 키가 설정된 셸에서 실행해도 CODEF를 호출할 수 없다.
tasks.withType(Test).matching { it.name != 'codefSandboxCheck' }.configureEach {
	environment.remove('CODEF_CLIENT_ID')
	environment.remove('CODEF_CLIENT_SECRET')
}

tasks.named('check') {
	dependsOn integrationTest
	dependsOn webTest
}
